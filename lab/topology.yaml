# lab/topology.yaml
# The GNS3 lab, declared as data - consumed by lab/rebuild_lab.py, which makes
# the running lab match this file. Everything the 2026-08-28 rebuild did by
# hand lives here so the next rebuild is one command instead of an afternoon.
#
# No credentials here on purpose (same rule as inventory.yaml): the device
# username/password to configure on the switch are prompted at runtime, or
# taken from SSH_USERNAME/SSH_PASSWORD like every other script.

gns3:
  # The GNS3 VM's web/API endpoint. Port 80 on this install, not the usual 3080.
  server: http://192.168.33.130
  project: Switch automation

# Templates are looked up by name and must already exist on the server -
# a fresh GNS3 install needs the IOSvL2 qcow2 and the docker image imported
# by hand first (disk images are the one thing this script cannot recreate).
templates:
  switch: Cisco IOSvL2
  automation_host: Network Automation

nodes:
  S1:
    template: switch
    x: 0
    y: 0
  NetworkAutomation-1:
    template: automation_host
    adapters: 2          # eth0 -> lab, eth1 -> VMnet8; the stock template has 1
    x: -250
    y: 0
  Cloud1:
    builtin: cloud       # created as a raw node, not from a template
    x: -500
    y: 0

links:
  # container eth0 <-> S1 Gi0/0 (the lab management segment)
  - [[NetworkAutomation-1, 0, 0], [S1, 0, 0]]
  # container eth1 <-> the GNS3 VM's eth1 (VMware VMnet8, port 1 on the Cloud)
  - [[NetworkAutomation-1, 1, 0], [Cloud1, 0, 1]]

automation_host:
  # eth0: lab management segment. Must match inventory.yaml's automation_host.
  lab_ip: 10.10.50.10
  lab_netmask: 255.255.255.0
  # eth1: VMnet8 (VMware NAT). Static and below the DHCP pool (.128-.254) so
  # the PyCharm/SSH target never moves on a lease change. The gateway/DNS .2
  # is VMware's NAT router on every default VMnet8.
  vmnet_ip: 192.168.231.50
  vmnet_netmask: 255.255.255.0
  vmnet_gateway: 192.168.231.2
  # Public key installed for root SSH. Key auth only - password login stays off.
  ssh_public_key: ~/.ssh/netauto_ed25519.pub
  # The repo cloned onto the host so scripts run there. Keep it current with
  # git pull - a clone makes "is the remote stale?" answerable by git log.
  repo_url: https://github.com/jflores3531/NetworkAutomation.git
  repo_path: /root/NetworkAutomation

switch:
  # Base config for a factory-fresh S1 - just enough that netauto.connect()
  # works and the STIG scripts take it from there. Must match inventory.yaml
  # (host: 10.10.50.11) and the management VLAN in non_user_vlans.
  hostname: S1
  domain: lab.local
  mgmt_vlan: 10
  mgmt_vlan_name: MGMT
  mgmt_ip: 10.10.50.11
  mgmt_netmask: 255.255.255.0
  uplink_interface: GigabitEthernet0/0
