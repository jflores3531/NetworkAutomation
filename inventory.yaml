# inventory.yaml
# Device inventory for network automation scripts.
# device_type values follow Netmiko's supported platform strings:
#   cisco_ios  -> R1, R2, S1, S2, S3 (IOS / IOSvL2)
#   cisco_nxos -> NXCore1, NXCore2 (NX-OS)
#
# NOTE: No credentials live in this file on purpose.
# Usernames/passwords are prompted for interactively at runtime
# (see netauto.get_credentials()).
# This file only defines WHICH devices exist and HOW to reach them.

# Consumed by netauto.load_inventory()/connect() - every script that opens
# an SSH session to a device reads this section.
devices:
  R1:
    host: 10.10.50.1
    device_type: cisco_ios

  R2:
    host: 10.10.51.2
    device_type: cisco_ios

  S1:
    host: 10.10.50.11
    device_type: cisco_ios

  S2:
    host: 10.10.50.12
    device_type: cisco_ios

  S3:
    host: 10.10.50.13
    device_type: cisco_ios

  NXCore1:
    host: 10.10.50.21
    device_type: cisco_nxos

  NXCore2:
    host: 10.10.50.22
    device_type: cisco_nxos

# Non-Netmiko infrastructure (Linux servers) — reference IPs only, no device_type,
# never connected to by netauto.connect(). Read via netauto.load_services().
services:
  # V-220601 (L2_stig_harden_global.py), V-220498 (NXOS_stig_harden_global.py), V-215693
  # (IOS_Router_stig_harden_global.py). Skipped with a warning by all three if empty.
  ntp_servers:
    - 192.168.100.10
    - 192.168.100.11
  # V-220620 (L2_stig_harden_global.py only - dual syslog servers). Skipped with a
  # warning if empty.
  syslog_servers:
    - 192.168.100.10
    - 192.168.100.11
  # V-220587/617 (L2_stig_harden_aaa.py - RADIUS as primary auth source).
  # Script aborts if empty (paired with secrets.yaml's radius_key).
  radius_servers:
    - 192.168.100.10
    - 192.168.100.11

# VLAN IDs to exclude when discovering "user VLANs" via netauto.load_non_user_vlans()
# for DHCP snooping (V-220633/V-220684) and DAI (V-220635/V-220686). Read by
# L2_stig_harden_global.py, L2_stig_harden_dai.py, L2_stig_audit.py, NXOS_stig_harden_global.py,
# and NXOS_stig_audit.py. Everything else found in `show vlan brief` is treated
# as a user VLAN needing these protections.
non_user_vlans:
  - 1    # default VLAN, unused
  - 10   # management / automation host segment
  - 100  # servers VLAN

# Per-device overrides for non_user_vlans, read via
# netauto.load_non_user_vlans(device_name=...). Only needed when a device's
# actual VLAN usage doesn't match the shared list above.
# NXCore1: VLAN 100 carries real server traffic on Ethernet1/3-4 (access
# ports) here, unlike the L2S switches where it's pure infrastructure - so
# it's deliberately left out of this override, meaning DHCP snooping/IPSG/DAI
# (V-220684/685/686) will cover it. VLAN 10 stays excluded - still just the
# mgmt SVI here, no access ports assigned to it.
non_user_vlans_by_device:
  NXCore1:
    - 1    # default VLAN, unused
    - 10   # management SVI, no access ports on it

# Management network for V-220575, read via netauto.load_management_subnet().
# Used only by L2_stig_audit.py's check to verify the vty ACL (pushed by
# L2_stig_harden_acl.py) doesn't permit anything outside this range - a single
# host inside it (e.g. the automation host) is fine, "permit any" is not.
# L2_stig_harden_acl.py itself doesn't read this - it scopes to automation_host
# below directly.
management_subnet: 10.10.50.0/24

# The automation host itself (NetworkAutomation-1) - not a device scripts
# connect *to* (not in the devices: section above), read via
# netauto.load_automation_host(). Needed as the sole permitted source for
# V-220575's vty ACL, pushed by L2_stig_harden_acl.py. Scoped to just this
# host rather than the whole management_subnet - least privilege. Script
# aborts if this is unset - it's the ACL's only permit line.
automation_host: 10.10.50.10

# Designated "unused ports" VLAN for V-220641/V-220690, read via
# netauto.load_unused_vlan(). Pushed by L2_stig_harden_global.py and
# NXOS_stig_harden_interfaces.py (disabled/shutdown access ports get assigned
# here, and it's pruned from all trunk links), checked by L2_stig_audit.py,
# and excluded from L2_device_tracking.py's per-VLAN policy pushes. Skipped
# with a warning if unset.
# Deliberately a DIFFERENT VLAN than native_vlan below - they used to both be
# 999, which seemed reasonable (a dedicated black-hole VLAN as native
# prevents double-tagging/VLAN-hopping via untagged native-VLAN traffic) but
# broke on NX-OS: V-220696 ("no switchports assigned to the native VLAN") is
# worded as a finding for ANY access port sharing the native VLAN's ID, with
# no carve-out for administratively-shutdown ports - so once disabled ports
# got assigned here, sharing native_vlan's ID became a literal V-220696
# violation. Split into two VLANs so the two rules' fixes never collide.
unused_vlan: 1000

# Native VLAN for all 802.1q trunk links, V-220646/V-220695, read via
# netauto.load_native_vlan(). Pushed by L2_stig_harden_global.py/
# NXOS_stig_harden_global.py (must not be the default VLAN) and excluded from
# L2_device_tracking.py's per-VLAN policy pushes. L2_stig_audit.py's
# V-220646 check doesn't read this value - it just verifies live config
# isn't VLAN 1.
native_vlan: 999

# Default VLAN for host-facing/access ports that aren't in trunk mode, read via
# netauto.load_default_access_vlan(). Pushed by L2_stig_harden_global.py only -
# L2_stig_audit.py's checks don't read this value, they just verify live config
# has an explicit non-default VLAN. A freshly built switch leaves these ports
# with no explicit switchport mode/VLAN at all, which silently breaks other
# access-port STIG fixes that require it (e.g. switchport block unicast/storm-
# control need the port to already be in access mode - confirmed live on a
# fresh S3 in GNS3). L2_stig_harden_global.py pushes 'switchport mode access' +
# 'switchport access vlan <this>' to every non-trunk port and creates the VLAN
# itself in the database (same pattern as unused_vlan/native_vlan).
default_access_vlan: 50

# VTP domain name, read via netauto.load_vtp_domain(). Required on NX-OS
# before 'vtp password' takes effect (V-220676) - confirmed live on NXCore1:
# pushing the password with no domain set fails with "Domain not set",
# silently (Netmiko doesn't treat it as fatal, so the script reports success
# while nothing was actually configured). Not needed on IOS L2S switches -
# L2_stig_harden_global.py sets the VTP password without a domain and it works.
# NXOS_stig_harden_global.py pushes this before 'vtp mode transparent' and the
# password itself.
vtp_domain: NETAUTO
