# inventory.yaml
# Device inventory for network automation scripts.
# device_type values follow Netmiko's supported platform strings:
#   cisco_ios  -> R1, R2, S1, S2, S3 (IOS / IOSvL2)
#   cisco_nxos -> NXCore1, NXCore2 (NX-OS)
#
# NOTE: No credentials live in this file on purpose.
# Usernames/passwords are prompted for interactively at runtime
# (see netauto.get_credentials()).
# This file only defines WHICH devices exist and HOW to reach them.

devices:
  R1:
    host: 10.10.50.1
    device_type: cisco_ios

  R2:
    host: 10.10.51.2
    device_type: cisco_ios

  S1:
    host: 10.10.50.11
    device_type: cisco_ios

  S2:
    host: 10.10.50.12
    device_type: cisco_ios

  S3:
    host: 10.10.50.13
    device_type: cisco_ios

  NXCore1:
    host: 10.10.50.21
    device_type: cisco_nxos

  NXCore2:
    host: 10.10.50.22
    device_type: cisco_nxos

# Non-Netmiko infrastructure (Linux servers) — reference IPs only, no device_type,
# never connected to by netauto.connect(). Used to pre-fill hardening script
# prompts (e.g. NTP server IPs) instead of asking for them interactively.
services:
  ntp_servers:
    - 192.168.100.10
    - 192.168.100.11
  syslog_servers:
    - 192.168.100.10
    - 192.168.100.11
  radius_servers:
    - 192.168.100.10

# VLAN IDs to exclude when discovering "user VLANs" for DHCP snooping
# (V-220633/V-220684) and DAI (V-220635/V-220686) pushes. Everything else found
# in `show vlan brief` is treated as a user VLAN needing these protections.
non_user_vlans:
  - 1    # default VLAN, unused
  - 10   # management / automation host segment
  - 100  # servers VLAN

# Management network for V-220575 (vty access-class ACL scope). Used to verify
# the vty ACL doesn't permit anything outside this range - a single host inside
# it (e.g. the automation host) is fine, "permit any" is not.
management_subnet: 10.10.50.0/24

# Designated "unused ports" VLAN for V-220641. Disabled (shutdown) access ports
# must be assigned here, and this VLAN must be pruned from all trunk links.
unused_vlan: 999

# Native VLAN for all 802.1q trunk links, V-220646 (must not be the default VLAN).
# Set to the same ID as unused_vlan on purpose - a dedicated black-hole VLAN as
# native prevents double-tagging/VLAN-hopping via untagged native-VLAN traffic.
native_vlan: 999
