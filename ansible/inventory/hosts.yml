---
# Mirrors the devices: section of ../../inventory.yaml (the Python scripts'
# inventory) - same hosts, same IPs, kept in sync by hand since Ansible's
# inventory format and that YAML aren't directly compatible.
all:
  children:
    l2_switches:
      hosts:
        S1:
          ansible_host: 10.10.50.11
        S2:
          ansible_host: 10.10.50.12
        S3:
          ansible_host: 10.10.50.13
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli
        ansible_become: true
        ansible_become_method: enable
    # Audit-only for now (stig_audit role) - no cisco.ios/ios_config
    # equivalent harden role exists yet for these, so no ansible_connection/
    # network_cli vars are set here. The stig_audit role delegates to
    # localhost and shells out to nxos_stig_audit.py (Netmiko), it doesn't
    # use Ansible's own device connection at all.
    nxos_switches:
      hosts:
        NXCore1:
          ansible_host: 10.10.50.21
        NXCore2:
          ansible_host: 10.10.50.22
