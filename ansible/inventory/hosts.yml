---
# Mirrors the devices: section of ../../inventory.yaml (the Python scripts'
# inventory) - same hosts, same IPs, kept in sync by hand since Ansible's
# inventory format and that YAML aren't directly compatible.
#
# Addresses are x.x.x.x placeholders: unlike ../../inventory.yaml, which is
# gitignored, this file is committed, so it must not carry a site's real
# addressing. Fill them in locally before running any play - Ansible will
# fail to resolve x.x.x.x rather than reach the wrong device.
all:
  children:
    l2_switches:
      hosts:
        S1:
          ansible_host: x.x.x.x
        S2:
          ansible_host: x.x.x.x
        S3:
          ansible_host: x.x.x.x
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli
        ansible_become: true
        ansible_become_method: enable
    # The stig_audit role doesn't use these connection vars - it delegates to
    # localhost and shells out to nxos_stig_audit.py, which makes its own
    # Netmiko connection. They exist for the nxos_stig_harden role, which
    # talks to the device through Ansible directly (cisco.nxos.nxos_config).
    #
    # NX-OS has no enable/privileged mode to escalate into the way IOS does -
    # authorisation is role-based (RBAC) on the account itself - so there is
    # no ansible_become here, unlike l2_switches above.
    nxos_switches:
      hosts:
        NXCore1:
          ansible_host: x.x.x.x
        # NXCore2 is powered off - the GNS3 lab does not have the RAM to run
        # both NX-OS switches. Left in the inventory because it is a real part
        # of the topology, but any play targeting the whole group will fail
        # against it. Use `--limit NXCore1` for live runs.
        NXCore2:
          ansible_host: x.x.x.x
      vars:
        ansible_network_os: cisco.nxos.nxos
        ansible_connection: ansible.netcommon.network_cli

    # ====================================================================
    # NAPALM / multi-vendor layer - see ../NAPALM.md
    # ====================================================================
    # Everything below was added for the multi-vendor work. The STIG groups
    # above are deliberately untouched: napalm_ios/napalm_nxos take them as
    # CHILDREN instead, so l2_switches and nxos_switches gain NAPALM coverage
    # without a single existing line changing, and without their hosts being
    # listed twice.
    #
    # Group membership is what picks both the driver and the roles for a
    # device, so put a new host in the group matching its real platform:
    #
    #   napalm_ios        -> NAPALM dev_os "ios" (IOS / IOS-XE, switch or router)
    #   napalm_nxos       -> NAPALM dev_os "nxos_ssh"
    #   napalm_junos      -> NAPALM dev_os "junos" (NETCONF; see the group below)
    #   palo_alto         -> paloaltonetworks.panos over the XML API
    #   fortigate/switch  -> parked, superseded by the two above

    # Every device driven by a NAPALM driver that ships WITH NAPALM ITSELF.
    # This is the group the read-only NAPALM plays target, and the distinction
    # it draws is install-time rather than cosmetic: ios, nxos_ssh and junos
    # are core drivers, present as soon as `pip install napalm` succeeds, so a
    # play across this group either works everywhere or fails on the
    # controller for everyone. The Palo Alto group below is deliberately NOT a
    # child, because its driver is a separate community package - see the
    # napalm_panos group.
    napalm_devices:
      children:
        napalm_ios: {}
        napalm_nxos: {}
        napalm_junos: {}

    # Parent group for every device NAPALM drives with the "ios" driver.
    # group_vars/napalm_ios/vars.yml sets napalm_dev_os for all of them at
    # once, which is the whole reason this layer is grouped by DRIVER rather
    # than by role-in-the-network.
    napalm_ios:
      children:
        # The existing STIG-managed lab switches, inherited as-is. They keep
        # every var set in their own block above; this only adds NAPALM's.
        l2_switches: {}
        # New multi-vendor lab: Cisco switches.
        ios_switches:
          hosts:
            SW1:
              ansible_host: x.x.x.x
            SW2:
              ansible_host: x.x.x.x
        # New multi-vendor lab: Cisco router(s). Separate group from the
        # switches because the routing-specific parts of cisco_baseline
        # (static routes, OSPF) should only ever target these.
        ios_routers:
          hosts:
            R1:
              ansible_host: x.x.x.x
      vars:
        # cisco.ios resource modules (ios_vlans, ios_interfaces, ...) reach
        # the device over network_cli. The napalm_* modules do NOT use this -
        # they run from the controller and take their connection details from
        # napalm_provider (group_vars/all/vars.yml), which is why the NAPALM
        # playbooks set `connection: local`.
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli
        ansible_become: true
        ansible_become_method: enable

    napalm_nxos:
      children:
        # The existing STIG-managed NX-OS cores, inherited as-is.
        nxos_switches: {}
        # Empty on purpose. The multi-vendor lab as planned has no Nexus in it
        # (Cisco switches and a router, Fortinet switches, a FortiGate), but
        # cisco_baseline has an NX-OS task file, and this is the group that
        # gives it somewhere to apply. A new Nexus goes here rather than into
        # nxos_switches above, which is STIG scope.
        nxos_lab:
          hosts: {}
      vars:
        # On the PARENT, not on nxos_switches, so a Nexus added to the empty
        # nxos_lab group above inherits them. Without this, a host put there as
        # the comment instructs reaches cisco_baseline with no
        # ansible_network_os at all and dies on an undefined variable rather
        # than on anything informative.
        #
        # nxos_switches (the STIG group) sets the same two values in its own
        # block, which is left untouched - a child's own vars win, so this
        # changes nothing for those hosts.
        ansible_network_os: cisco.nxos.nxos
        ansible_connection: ansible.netcommon.network_cli

    # --- Juniper switches ------------------------------------------------
    # The best-supported driver NAPALM has, and the reason this layer is worth
    # building around NAPALM rather than around per-vendor modules: Junos has a
    # real candidate configuration, so `commit`, `rollback` and `commit
    # confirmed` are native operations rather than something the driver
    # emulates. A diff before a push on Junos is the device's own diff, and a
    # failed commit leaves nothing behind.
    #
    # PRECONDITION on every host here: `set system services netconf ssh`. Both
    # paths into these switches speak NETCONF - NAPALM's junos driver (through
    # junos-eznc) and the junipernetworks.junos resource modules (through the
    # netconf connection plugin) - so without it nothing in this project can
    # reach them, while SSH to the CLI still works and makes it look like a
    # credentials problem.
    napalm_junos:
      children:
        juniper_switches:
          hosts:
            JSW1:
              ansible_host: x.x.x.x
            JSW2:
              ansible_host: x.x.x.x
            JSW3:
              ansible_host: x.x.x.x
      vars:
        # For the junipernetworks.junos resource modules. The napalm_* modules
        # ignore this and use napalm_provider, same as the Cisco groups.
        ansible_network_os: junipernetworks.junos.junos
        ansible_connection: ansible.netcommon.netconf
        # No ansible_become: Junos authorisation is class-based on the account
        # (a user in the `super-user` class is already privileged), so there is
        # no enable-style escalation to perform - the same reason the NX-OS
        # group carries none.

    # --- Palo Alto firewall ------------------------------------------------
    # Deliberately not a child of napalm_devices. NAPALM can drive PAN-OS, but
    # only through napalm-panos, a separate community-maintained package whose
    # getter coverage is thin (facts, config, interfaces - no environment, no
    # mac table). So:
    #
    #   config       -> paloaltonetworks.panos, Palo Alto's own certified
    #                   collection, one module per config area
    #   facts/backup -> napalm-panos IF it is installed (see the napalm_panos
    #                   group below), otherwise panos_facts and the config
    #                   export in playbooks/panos_baseline.yml
    #
    # The panos collection does not use an Ansible connection plugin: its
    # modules run on the controller against the firewall's XML API through
    # pan-os-python, taking a provider dict. Hence connection: local here,
    # matching how the napalm_* modules work.
    palo_alto:
      hosts:
        PA1:
          ansible_host: x.x.x.x
      vars:
        ansible_connection: local
        ansible_network_os: paloaltonetworks.panos.panos

    # Palo Alto again, as a NAPALM group. Separate from palo_alto above rather
    # than merged into it because membership here is a claim that
    # `pip install napalm-panos` has been done on the controller - a NAPALM
    # play against this group fails on the controller without it. Empty until
    # that is true and has been proven against the firewall.
    napalm_panos:
      hosts: {}
      vars:
        napalm_dev_os: panos
        napalm_getters:
          - facts
          - interfaces

    # --- Fortinet (PARKED) -------------------------------------------------
    # Superseded: the project is moving to a Palo Alto firewall in place of the
    # FortiGate and Juniper switches in place of the FortiSwitches. Kept
    # working rather than deleted, because it costs nothing to leave in place
    # and the FortiGate role is the only worked example here of a
    # single-object-per-endpoint REST API.
    #
    # Nothing targets these groups by default any more - playbooks/
    # multivendor_site.yml runs the Juniper and Palo Alto plays instead, and
    # playbooks/fortinet_baseline.yml has to be invoked directly. No NAPALM
    # driver exists for either platform, which is why they never appear under
    # napalm_*.
    fortinet:
      children:
        fortigate:
          hosts:
            FGT1:
              ansible_host: x.x.x.x
          vars:
            ansible_network_os: fortinet.fortios.fortios
        fortiswitch:
          hosts:
            FSW1:
              ansible_host: x.x.x.x
            FSW2:
              ansible_host: x.x.x.x
          vars:
            ansible_network_os: fortinet.fortiswitch.fortiswitch
      vars:
        ansible_connection: httpapi
        ansible_httpapi_use_ssl: true
        ansible_httpapi_port: 443
        # false because a lab FortiGate/FortiSwitch presents a self-signed
        # certificate and the play would otherwise fail on it. This is a real
        # weakening of transport security - the connection is still encrypted
        # but nothing proves what is on the other end. Set it true once the
        # lab devices carry certificates the controller trusts.
        ansible_httpapi_validate_certs: false
