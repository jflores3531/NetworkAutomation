---
# Non-secret variables for the l2_switches group. Values mirror
# ../../../../inventory.yaml exactly (same STIG rules, same network-design
# facts) so the Ansible and Python implementations stay in sync.

# Consumed by the stig_audit role - runs l2_stig_audit.py against this group.
audit_script: l2_stig_audit.py

# VLAN IDs excluded when discovering "user VLANs" for DHCP snooping/DAI
# (V-220633/V-220635) - see non_user_vlans in inventory.yaml.
non_user_vlans:
  - 1    # default VLAN, unused
  - 10   # management / automation host segment
  - 100  # servers VLAN

# Designated "unused ports" VLAN for V-220641 - see unused_vlan in inventory.yaml.
#
# Deliberately a DIFFERENT VLAN than native_vlan below. The two were both 999
# originally - a dedicated black-hole VLAN doing double duty as the native VLAN
# prevents double-tagging/VLAN-hopping via untagged native-VLAN traffic, which
# seemed reasonable - but once disabled access ports started being parked here,
# sharing native_vlan's ID made every one of them an access port sitting on the
# native VLAN, a literal V-220696 violation. Split so the two rules' fixes
# cannot collide.
#
# This file lagged that split until 2026-08-12: inventory.yaml and the
# nxos_switches group_vars moved to 1000, this one stayed at 999, and the
# header's claim that it mirrors inventory.yaml quietly stopped being true.
# Live effect on S1 - VLAN 1000 was allowed across trunks instead of pruned,
# because the exclude list resolved to [1, 999, 999]. Commit 64951ec, which
# added native_vlan to that exclude expression in both roles, was a no-op here
# for exactly this reason: the code fix landed without its data.
unused_vlan: 1000

# Native VLAN for all 802.1q trunk links, V-220646 - see native_vlan in
# inventory.yaml. Stays 999; see the split described above.
native_vlan: 999

# Default VLAN for host-facing/access ports not already in trunk mode,
# V-220642/645 - see default_access_vlan in inventory.yaml.
default_access_vlan: 50

# NTP servers, V-220601 - see services.ntp_servers in inventory.yaml.
ntp_servers:
  - 192.168.100.10
  - 192.168.100.11

# Syslog servers, V-220620 - see services.syslog_servers in inventory.yaml.
syslog_servers:
  - 192.168.100.10
  - 192.168.100.11

# The automation host's own IP, V-220575 - see automation_host in
# inventory.yaml. The sole permitted source in the vty management ACL pushed by
# the l2s_stig_harden_acl role: least privilege, and simpler to reason about
# than permitting the whole management_subnet.
#
# Getting this wrong locks every management source out of the device, so the
# role asserts it is a bare IPv4 address rather than trusting it.
automation_host: 10.10.50.10

# RADIUS servers, V-220587/617 - see services.radius_servers in inventory.yaml.
# Consumed by the l2s_stig_harden_aaa role, which ABORTS rather than skipping if
# this is empty (unlike the ntp/syslog lists above, which the bulk role skips
# with a warning) - there is no safe partial version of an AAA push.
radius_servers:
  - 192.168.100.10
  - 192.168.100.11

# Bridges the vaulted secrets (vault.yml, encrypted) to plain variable names -
# standard Ansible vault convention (vault_* holds the raw secret, the
# plain name is what tasks actually reference).
vtp_password: "{{ vault_vtp_password }}"
snmpv3_auth_password: "{{ vault_snmpv3_auth_password }}"
snmpv3_priv_password: "{{ vault_snmpv3_priv_password }}"
ntp_auth_key_id: "{{ vault_ntp_auth_key_id }}"
ntp_auth_key_value: "{{ vault_ntp_auth_key_value }}"
# default('') throughout the AAA vars below, unlike the vault bindings above.
# These were added after the vault files were already in use, so an existing
# vault.yml predating them has no vault_radius_key/vault_enable_secret. Bound
# bare, an absent key is an undefined-variable error, and ansible_become_pass
# is evaluated on EVERY connection to this group - so a stale vault would break
# the bulk l2s_harden.yml run too, not just the AAA playbook. Defaulting to ''
# keeps the previous behaviour exactly (become with no enable password) and
# lets the AAA role's own assert produce an actionable message instead.
radius_key: "{{ vault_radius_key | default('') }}"

# The privileged EXEC secret, used in two places that MUST agree:
#
#   enable_secret       - what the l2s_stig_harden_aaa role pushes to the device
#   ansible_become_pass - what Ansible uses to escalate on every connection
#
# Both are bound to the same vault variable deliberately, so they cannot drift.
# That coupling is what makes the role's safety check meaningful: it pushes the
# secret, tears the connection down (meta: reset_connection), and requires a
# full fresh login plus re-escalation to succeed before it will touch
# aaa new-model. If these two were separate variables and disagreed, that check
# would fail - which is the correct outcome, but a confusing way to discover a
# typo. Binding them here means the check is testing the device, not the
# inventory.
#
# Mirrors secrets.yaml's enable_secret on the Python side.
enable_secret: "{{ vault_enable_secret | default('') }}"
ansible_become_pass: "{{ vault_enable_secret | default('') }}"
