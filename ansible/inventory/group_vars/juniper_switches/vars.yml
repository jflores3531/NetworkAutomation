---
# JSW1 and JSW2 - the Juniper access layer, consumed by junos_baseline.
#
# Per-switch values (which VLAN its access ports serve) are in
# ../../host_vars/JSW1.yml and JSW2.yml.
#
# Topology (see ../../../NAPALM.md):
#
#   SW1 ─ge-0/0/0─┐                    each switch dual-homed to both
#   SW2 ─ge-0/0/1─┴─ JSWn              distribution switches; STP blocks one
#                     ge-0/0/2..5 = access ports
#
# TWO PRECONDITIONS, both manual, both before any play here can run:
#
#   1. `set system services netconf ssh` - every path into these switches
#      speaks NETCONF (NAPALM's junos driver and the junipernetworks.junos
#      resource modules alike). Without it, SSH to the CLI still works, which
#      makes the failure look like bad credentials. playbooks/preflight.yml
#      checks 830 then 22 specifically to tell those two apart.
#   2. fxp0 addressed on the management segment (JSW1 10.10.50.14, JSW2 .15).
#      Nothing can configure the interface it would have to arrive on.
#
# ONE SHAPE DIFFERENCE FROM THE CISCO GROUPS, and it is a platform fact rather
# than a style choice: Junos ethernet-switching references VLANs BY NAME. The
# ID lives only in the `vlans <name> vlan-id <id>` stanza, so the access and
# trunk entries below carry `USERS`/`SERVERS` where ../ios_switches/vars.yml
# carries 10 and 20. Deliberately not abstracted behind a shared shape - a
# translation layer that mapped name to ID would put a port on the wrong VLAN
# the day it got the mapping wrong, which is worse than the duplication.

baseline_domain_name: lab.local

# Named to match the Cisco side's VLAN names, IDs included, because the trunks
# between them carry both and a mismatch is a silently black-holed VLAN.
baseline_vlans:
  - name: USERS
    vlan_id: 10
  - name: SERVERS
    vlan_id: 20
  - name: NATIVE_UNUSED
    vlan_id: 999

# Uplinks to both distribution switches. allowed_vlans are NAMES; native_vlan is
# an ID, because Junos models it as `native-vlan-id` - the asymmetry is the
# platform's, not this file's.
baseline_trunk_ports:
  - name: ge-0/0/0
    description: trunk to SW1
    allowed_vlans: [USERS, SERVERS]
    native_vlan: 999
  - name: ge-0/0/1
    description: trunk to SW2
    allowed_vlans: [USERS, SERVERS]
    native_vlan: 999

# Access ports are per-switch: JSW1 serves USERS, JSW2 serves SERVERS. See
# host_vars.
baseline_access_ports: []

# No baseline_l3_interfaces. These are pure layer 2 - the gateway for both VLANs
# is the HSRP address on R1/R2, and fxp0 (management) is out of scope for
# automation as noted above. An irb here would be a second gateway competing
# with the routers' HSRP.
baseline_l3_interfaces: []

baseline_ntp_servers:
  - 10.10.50.10
baseline_syslog_servers:
  - 10.10.50.10

# Per-interface on Junos, unlike IOS's single `lldp run` - junos_baseline enables
# the protocol globally and then names each port. Worth having: the LLDP
# neighbour map is how napalm_facts reads this topology off the devices, and it
# is the one check that catches a miscabled uplink.
baseline_lldp_enabled: true
