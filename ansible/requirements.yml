---
# Install with: ansible-galaxy collection install -r requirements.yml
collections:
  # Pinned to 4.4.0, not just ">=X" - confirmed live that latest (11.5.0)
  # declares requires_ansible >=2.16.0, which warns/may misbehave against
  # this project's ansible-core 2.13.13 (pip's max version compatible with
  # this host's Python 3.8). 4.4.0 declares >=2.9.10, comfortably covers it.
  - name: cisco.ios
    version: "4.4.0"
  # Same era and same reasoning as the cisco.ios pin above.
  - name: cisco.nxos
    version: "4.4.0"
  # Pinned explicitly even though cisco.ios/cisco.nxos pull it in as a
  # dependency. Leaving it implicit is how it drifted to a version that broke
  # every network module on the host: netcommon 2.x+ needs ansible-base >=2.10,
  # and when the automation host was left running the distro's ansible 2.9.6
  # (see README), every module failed with
  #
  #   ConnectionError: deprecated() got an unexpected keyword argument 'date'
  #
  # because Display.deprecated() only gained `date` in 2.10. That error comes
  # back from the persistent connection process, so it reads as a role or
  # platform bug rather than a version problem - three cisco.nxos pins were
  # burned chasing it before anyone ran `ansible --version`. Pinning it here
  # means `ansible-galaxy install -r requirements.yml` restores a known-good
  # set rather than whatever a dependency resolver picks.
  - name: ansible.netcommon
    version: "4.1.0"
  # Not used yet - added here ahead of the Arista switch mentioned in
  # project chat, so `ansible-galaxy install -r requirements.yml` won't
  # need to change when that device is added. NOT yet verified against
  # ansible-core 2.13.13 the way cisco.ios was above - check its own
  # meta/runtime.yml requires_ansible the same way before relying on it.
  - name: arista.eos
    version: ">=6.0.0"

  # ====================================================================
  # NAPALM / multi-vendor layer - see NAPALM.md
  # ====================================================================
  # Unpinned, unlike everything above, and that difference is deliberate. The
  # pins above exist to hold cisco.ios/cisco.nxos at versions that still
  # declare requires_ansible >=2.9.10, because the STIG automation host is
  # Ubuntu 20.04 / Python 3.8 and cannot run newer than ansible-core 2.13.13.
  #
  # The multi-vendor work has no such constraint and should not inherit one:
  # fortinet.fortios in particular moves fast, and its recent releases declare
  # requires_ansible >=2.15. So THIS SET NEEDS A NEWER CONTROLLER than the
  # STIG roles do. Two options, both fine:
  #
  #   - run the multi-vendor plays from a host with a current ansible-core
  #     (the simplest, and what the new lab should get), or
  #   - keep both on one host in separate virtualenvs, since the collection
  #     path follows the interpreter.
  #
  # What does NOT work is installing these on the 2.13.13 host and assuming
  # the version resolver will pick compatible releases - that is exactly how
  # ansible.netcommon drifted and took every network module down with it, the
  # story in the comment above.

  # NAPALM's own modules: napalm_get_facts, napalm_install_config,
  # napalm_validate (plus the YANG ones, unused here). Needs the `napalm`
  # Python library on the controller - see requirements.txt.
  - name: napalm.ansible

  # Juniper switches. Both paths into them speak NETCONF - this collection
  # through the netconf connection plugin, and NAPALM's junos driver through
  # junos-eznc - so `set system services netconf ssh` on the device is a
  # prerequisite for either.
  - name: junipernetworks.junos

  # Palo Alto firewall. Certified collection, one module per config area
  # (zones, address objects, security rules, static routes, commit). Runs on
  # the controller against the XML API via pan-os-python; no connection plugin
  # involved, which is why the palo_alto group sets connection: local.
  #
  # NAPALM can also reach PAN-OS, but only through the community napalm-panos
  # package, whose getters stop at facts/config/interfaces and model none of
  # what a firewall is. That package is optional here - see requirements.txt
  # and the napalm_panos group in inventory/hosts.yml.
  - name: paloaltonetworks.panos

  # PARKED: the Fortinet collections. The project is moving to Palo Alto in
  # place of the FortiGate and Juniper in place of the FortiSwitches. Left
  # installed because playbooks/fortinet_baseline.yml still works and the
  # FortiGate role is the only worked example here of a
  # single-object-per-endpoint REST API. Remove these two lines if that
  # hardware is gone for good.
  - name: fortinet.fortios
  - name: fortinet.fortiswitch

  # Used by the resource-module roles for data manipulation, and pulled in by
  # netcommon anyway. Listed explicitly for the same reason netcommon is.
  - name: ansible.utils
