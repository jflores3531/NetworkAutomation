---
# Install with: ansible-galaxy collection install -r requirements.yml
collections:
  # Pinned to 4.4.0, not just ">=X" - confirmed live that latest (11.5.0)
  # declares requires_ansible >=2.16.0, which warns/may misbehave against
  # this project's ansible-core 2.13.13 (pip's max version compatible with
  # this host's Python 3.8). 4.4.0 declares >=2.9.10, comfortably covers it.
  - name: cisco.ios
    version: "4.4.0"
  # Same era and same reasoning as the cisco.ios pin above.
  - name: cisco.nxos
    version: "4.4.0"
  # Pinned explicitly even though cisco.ios/cisco.nxos pull it in as a
  # dependency. Leaving it implicit is how it drifted to a version that broke
  # every network module on the host: netcommon 2.x+ needs ansible-base >=2.10,
  # and when the automation host was left running the distro's ansible 2.9.6
  # (see README), every module failed with
  #
  #   ConnectionError: deprecated() got an unexpected keyword argument 'date'
  #
  # because Display.deprecated() only gained `date` in 2.10. That error comes
  # back from the persistent connection process, so it reads as a role or
  # platform bug rather than a version problem - three cisco.nxos pins were
  # burned chasing it before anyone ran `ansible --version`. Pinning it here
  # means `ansible-galaxy install -r requirements.yml` restores a known-good
  # set rather than whatever a dependency resolver picks.
  - name: ansible.netcommon
    version: "4.1.0"
  # Not used yet - added here ahead of the Arista switch mentioned in
  # project chat, so `ansible-galaxy install -r requirements.yml` won't
  # need to change when that device is added. NOT yet verified against
  # ansible-core 2.13.13 the way cisco.ios was above - check its own
  # meta/runtime.yml requires_ansible the same way before relying on it.
  - name: arista.eos
    version: ">=6.0.0"

  # Used by the resource-module roles for data manipulation, and pulled in by
  # netcommon anyway. Listed explicitly for the same reason netcommon is.
  - name: ansible.utils

  # THE MULTI-VENDOR COLLECTIONS ARE NOT HERE. NAPALM, Juniper, Palo Alto,
  # and the Fortinet gear are in requirements-multivendor.yml, for a controller
  # with a current ansible-core. They were in this file until 2026-09-13, and
  # it could not install on either controller. On this 2.13 host they need a
  # newer ansible-core than it can run. On a current controller,
  # junipernetworks.junos needs ansible.netcommon >= 8.1.0, which the 4.1.0
  # pin above rules out - and napalm.ansible does not exist on Galaxy at all.
