---
# Operational health across every NAPALM-driven device - the Ansible/NAPALM
# counterpart to ../../scripts/health_check.py, and the play to run before and
# after any change window.
#
#   ansible-playbook playbooks/napalm_healthcheck.yml
#   ansible-playbook playbooks/napalm_healthcheck.yml -e napalm_healthcheck_fail=true
#
# The second form turns it into a gate: the play fails on any finding, which is
# how to avoid starting a push against a device that is already unhealthy. The
# default reports and continues, because a monitoring pass that aborts on the
# first sick device never surveys the rest of the fleet.
- name: Check operational health through NAPALM
  hosts: napalm_devices
  gather_facts: false
  # Controller-only. The keyword AND the vars are both needed - an inventory
  # ansible_connection outranks a play keyword, so the keyword alone leaves
  # undelegated tasks loading each group's network_cli/netconf plugin. See
  # "Why these plays set both connection: local and ansible_connection" in
  # ../NAPALM.md.
  connection: local
  vars:
    ansible_connection: local
    ansible_become: false
  vars_prompt:
    - name: napalm_username
      prompt: "Device username"
      private: false
    - name: napalm_password
      prompt: "Device password"
      private: true
  roles:
    - napalm_healthcheck
