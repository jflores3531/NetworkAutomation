---
# Global (non-interface-specific) fixes - mirrors l2_stig_harden_global.py's
# BASE_FIXES/OPTIONAL_FIXES/UNNECESSARY_SERVICES_FIX/SSH_ENCRYPTION_FIX/
# ARCHIVE_LOGGING_FIX/VTY_SESSION_LIMIT_FIX/CONSOLE_EXEC_TIMEOUT_FIX exactly.

# Several lines below are IOS defaults, and `show running-config` omits
# anything sitting at its default value - `ip igmp snooping` is on by default,
# and the `no` form of an already-off service renders nothing at all. Diffed
# against plain running-config, ios_config could never find them, so it
# reported changed and re-pushed no-ops on every run. `show running-config all`
# does include defaults, which is what makes these tasks idempotent. Same fix
# as the nxos_stig_harden role's BASE_FIXES.
#
# Usefully bounded, confirmed on S1: `no ip http server` and `no service pad`
# were always fine, because those two services are on by default so the `no`
# is a real override that does render.
- name: Gather show running-config all (includes default-valued lines)
  cisco.ios.ios_command:
    commands:
      - show running-config all
  register: ios_running_config_all

# V-220623a/b (dot1x system-auth-control + AAA method) are deliberately NOT
# in this batch - see l2_stig_harden_global.py/l2_stig_harden_aaa.py, which this
# role mirrors. 'aaa authentication dot1x default group radius' needs aaa
# new-model already active to be valid syntax at all (confirmed live: it
# was rejected on S2, which doesn't have aaa new-model, but succeeded on
# S1/S3, which do). This role doesn't push aaa new-model (out of scope,
# same as l2_stig_harden_global.py).
#
# They ARE now pushed, by the l2s_stig_harden_aaa role - right after
# aaa new-model, in the same atomic ios_config task, so the prerequisite is
# guaranteed active. Run playbooks/l2s_harden_aaa.yml to apply them. (Until
# that role existed there was nowhere for these two lines to live, and they
# had no Ansible path at all.)
- name: "V-220630/631/637/638/639/580/599/612/576/578/570a/595a/600 - global BASE_FIXES"
  cisco.ios.ios_config:
    running_config: "{{ ios_running_config_all.stdout[0] }}"
    lines:
      # The 'edge' keyword is deliberate. IOS 15.x accepts the command without
      # it but stores the normalised form, so sending the bare version means
      # ios_config never finds it and re-pushes on every run - confirmed on S1
      # 2026-08-12, where this single line was enough to make the whole task
      # report changed. The device holds 'spanning-tree portfast edge bpduguard
      # default'; running-config is replayable by design, so its own rendered
      # form is safe to send back. Same normalisation l2_stig_audit.py already
      # accepts both spellings of.
      - spanning-tree portfast edge bpduguard default   # V-220630 (BPDU Guard)
      - spanning-tree loopguard default             # V-220631 (Loop Guard)
      - spanning-tree mode rapid-pvst                # V-220638 (Rapid-PVST)
      - udld enable                                   # V-220639 (UDLD)
      - ip igmp snooping                              # V-220637 (IGMP snooping)
      - service timestamps log datetime localtime     # V-220580 (log timestamps)
      - logging buffered 64000 informational          # V-220599 (logging buffer size)
      - login on-failure log                          # V-220612a
      - login on-success log                          # V-220612b
      - login block-for 900 attempts 3 within 120      # V-220576 (lockout)
      - logging userinfo                               # V-220578 (admin activity logging)
      - ip http max-connections 2                      # V-220570a (HTTP session limit)
      - service password-encryption                     # V-220595a (password encryption)
      - logging trap critical                              # V-220600 (audit failure alert)

# `ip device tracking` is NOT a STIG requirement - host visibility only, the
# same thing l2_stig_harden_global.py keeps in its separate OPTIONAL_FIXES
# bucket rather than mixed into BASE_FIXES. Split out here for the same reason,
# plus a practical one specific to this lab: the command is accepted and logged
# on vios_l2 but the feature never actually activates (`show ip device tracking
# all` permanently reports Disabled - see the project's Bugs notes), so it may
# not render in running-config at all, even with `all`. Left inside BASE_FIXES
# it would keep a task made entirely of STIG rules reporting changed forever
# over a line that isn't a STIG rule and can't work here anyway.
- name: "ip device tracking - NOT a STIG rule, host visibility only (non-functional on vios_l2)"
  cisco.ios.ios_config:
    running_config: "{{ ios_running_config_all.stdout[0] }}"
    lines:
      - ip device tracking

# V-220625/V-220583-585: confirmed live (see the project vault's Bugs/README.md) that
# this lab's vios_l2 image rejects both commands outright ("% Invalid
# input"). Kept for real hardware - split into their own ignore_errors
# tasks so a known lab limitation doesn't abort the whole play the way
# it did when bundled into the batch above: ios_config (unlike Netmiko's
# send_config_set()) treats any rejected command as fatal and stops
# sending the rest of that task's lines entirely, not just that one line.
- name: "V-220625 - QoS enabled (confirmed rejected on this lab's vios_l2, kept for real hardware)"
  cisco.ios.ios_config:
    lines:
      - mls qos
  ignore_errors: true

- name: "V-220583/584/585 - file privilege 15 (confirmed rejected on this lab's vios_l2, kept for real hardware)"
  cisco.ios.ios_config:
    lines:
      - file privilege 15
  ignore_errors: true

# These five are the V-220586 lines the `show running-config all` diff can
# actually resolve. `no ip http server` and `no service pad` render because
# those services are ON by default, so the `no` is a real override; `no ip
# bootp server`, `no ip finger` and `no service config` were confirmed on S1
# 2026-08-12 to show up once diffed against `all`.
- name: "V-220586 - disable unnecessary/nonsecure services (renders in running-config)"
  cisco.ios.ios_config:
    running_config: "{{ ios_running_config_all.stdout[0] }}"
    lines:
      - no ip bootp server
      - no ip finger
      - no ip http server
      - no service config
      - no service pad

# The remaining seven are the awkward ones. They are off by default AND IOS
# renders nothing for their disabled state - not in `show running-config`, and
# confirmed on S1 2026-08-12 not in `show running-config all` either, unlike
# the five above. There is simply no config text for ios_config to match, so
# they re-pushed every run no matter what they were diffed against.
#
# So the question gets inverted: instead of looking for the disabled state,
# look for each service's ENABLED form. If that isn't present the service is
# already off and already compliant, and nothing needs pushing. Only a service
# genuinely turned on produces a line to send.
#
# Same shape l2_stig_audit.py uses for `show vtp password` and `show snmp
# user` - when the state isn't in config text, ask the device a different
# question rather than diffing harder.
- name: V-220586 services whose disabled state IOS never renders
  set_fact:
    v220586_hidden_when_off:
      - boot network
      - ip boot server
      - ip rcmd rcp-enable
      - ip rcmd rsh-enable
      - service finger
      - service tcp-small-servers
      - service udp-small-servers
    running_config_lines: "{{ ios_running_config_all.stdout[0].splitlines() | map('trim') | list }}"

# Matched at line start rather than exactly, so an enabled form carrying
# arguments (`boot network tftp://...`) still counts. The `no ...` form can
# never false-match, since the match is anchored to the start of the line.
- name: Of those, only the ones actually enabled on this device
  set_fact:
    v220586_disable_lines: >-
      [{% for s in v220586_hidden_when_off %}{% if running_config_lines | select('match', s) | list | length > 0 %}'no {{ s }}',{% endif %}{% endfor %}]

- name: "V-220586 - disable the hidden-when-off services that are actually enabled"
  cisco.ios.ios_config:
    lines: "{{ v220586_disable_lines }}"
  when: v220586_disable_lines | length > 0

# Confirmed live (Bugs/README.md) that these three specific services are
# rejected outright on this lab's vios_l2 - same ignore_errors reasoning
# as V-220625/V-220583-585 above.
- name: "V-220586 - unnecessary services confirmed rejected on this lab's vios_l2, kept for real hardware"
  cisco.ios.ios_config:
    lines:
      - no ip dns server
      - no ip identd
      - no service call-home
  ignore_errors: true

- name: "V-220607/608 - SSH encryption algorithm"
  cisco.ios.ios_config:
    lines:
      - ip ssh version 2
      - ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr

- name: "V-220571/572/573/574/582/597/611/613 - archive/config-change logging"
  cisco.ios.ios_config:
    lines:
      - logging enable
      - logging size 1000
      - notify syslog contenttype plaintext
      - hidekeys
    parents:
      - archive
      - log config

- name: "V-220570b/596 - vty session limit + exec-timeout"
  cisco.ios.ios_config:
    lines:
      - session-limit 5
      - exec-timeout 5 0
    parents: line vty 0 4

- name: "V-220596 - console exec-timeout (DISA's Fix Text requires both console and vty)"
  cisco.ios.ios_config:
    lines:
      - exec-timeout 5 0
    parents: line con 0

# no_log because the password is interpolated straight into a pushed line -
# without it Ansible echoes the rendered command, so the secret lands in
# console output and any tee'd log file. Confirmed 2026-08-12: a check run
# printed `vtp password CHANGE_ME` in the clear.
#
# The CHANGE_ME guard matters as much as the length check. Gated on length
# alone, an unfilled vault doesn't skip the task - it pushes the literal
# string CHANGE_ME as the device's real VTP password. Skipping is the safe
# failure: fill and encrypt vault.yml to configure VTP from here.
- name: "V-220624 - VTP authentication"
  cisco.ios.ios_config:
    lines:
      - "vtp password {{ vtp_password }}"
  no_log: true
  when:
    - vtp_password | default('') | length > 0
    - vtp_password != 'CHANGE_ME'

- name: Build syslog server lines
  set_fact:
    syslog_lines: "{{ syslog_servers | map('regex_replace', '(.+)', 'logging host \\1') | list }}"
  when: syslog_servers | length > 0

- name: "V-220620 - dual syslog servers"
  cisco.ios.ios_config:
    lines: "{{ syslog_lines }}"
  when: syslog_servers | length > 0
