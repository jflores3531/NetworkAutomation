---
# Mirrors L2_stig_harden_dai.py: push 'ip arp inspection vlan <ids>'
# (V-220635, Dynamic ARP Inspection), scoped to genuinely-discovered user
# VLANs. Kept as its own role, not merged into l2s_stig_harden, for the
# same reason the Python script is separate - DAI only trusts the DHCP
# snooping binding table, same static-host-binding risk as IPSG.
#
# Assumes l2s_stig_harden (or L2_stig_harden_global.py) has already run - DHCP
# snooping enabled, trunk/uplink ports already 'ip arp inspection
# trust'ed. Neither is set up by this role itself. Without trunk trust,
# DAI also drops legitimate transit ARP traffic from hosts behind other
# switches (confirmed live: S1 dropped ARP for a host bound only on S3's
# local table).
#
# Fix Text/Check Text cross-check (2026-07-24) found no discrepancy for
# V-220635 - single command scoped to user VLANs, no platform exemption -
# so this is a direct port with no fix needed first.

- name: Gather show vlan brief
  cisco.ios.ios_command:
    commands:
      - show vlan brief
  register: vlan_brief_result

- name: >-
    Discover genuine user VLANs (excludes non_user_vlans and the reserved
    fddi/token-ring 1002-1005 range)
  set_fact:
    user_vlan_ids: >-
      {{
        vlan_brief_result.stdout[0]
        | regex_findall('(?m)^(\d+)\s+\S+')
        | map('int')
        | reject('in', non_user_vlans | map('int') | list)
        | reject('in', range(1002, 1006) | list)
        | map('string')
        | list
      }}

- name: "V-220635 - Dynamic ARP Inspection for discovered user VLANs"
  cisco.ios.ios_config:
    lines:
      - "ip arp inspection vlan {{ user_vlan_ids | join(',') }}"
  when: user_vlan_ids | length > 0
