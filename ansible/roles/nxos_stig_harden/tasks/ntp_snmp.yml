---
# Logging, SNMPv3 and NTP - all three via resource modules rather than raw
# nxos_config lines. These compare structured facts instead of literal
# strings, which is what makes them idempotent against a device that renders
# config differently to how it was typed: the raw-lines version of the NTP
# task below re-pushed on every run because NX-OS stores
# 'ntp server <ip> use-vrf default key 1' and the role sent 'ntp server <ip>'.
#
# state: merged throughout, deliberately. 'overridden'/'replaced' would delete
# any server, host or user not named here - this role hardens a device, it
# does not own the whole of its NTP/logging/SNMP configuration.

# V-220516 (syslog servers), V-220496 (logfile size) and V-220510 (authpriv
# logging level). The latter two moved here out of global.yml's BASE_FIXES -
# they are logging configuration and belong with the rest of it, and being
# NX-OS-default-adjacent they were part of what made that task report changed
# on every run.
- name: "V-220516/V-220496/V-220510 - syslog servers, logfile and authpriv level"
  cisco.nxos.nxos_logging_global:
    config:
      # Built with an inline Jinja loop rather than a map()/dict_kv chain -
      # dict_kv lives in community.general, which is deliberately not
      # installed here (it does not support ansible-core 2.13.13).
      # 'informational', not 6. The module validates severity against names
      # (emergency/alert/critical/error/warning/notification/informational/
      # debugging) even though the CLI takes the numeric level - severity 6 on
      # the wire is 'informational' here. Same for logfile and levels below.
      hosts: >-
        [{% for s in syslog_servers %}
          {'host': '{{ s }}', 'severity': 'informational'}{{ ',' if not loop.last else '' }}
        {% endfor %}]
      logfile:
        name: STIG_LOGFILE
        level: informational
        size: 64000
      levels:
        - facility: authpriv
          level: informational
    state: merged
  when: syslog_servers | default([]) | length > 0

# V-220500/501: SNMPv3 with SHA authentication and AES-128 privacy. The user
# is left in the built-in network-operator role.
#
# no_log because the config carries both passwords - Ansible echoes task args
# on failure by default.
- name: "V-220500/501 - SNMPv3 auth and privacy"
  cisco.nxos.nxos_snmp_server:
    config:
      users:
        auth:
          - user: SNMPV3_USER
            group: network-operator
            authentication:
              algorithm: sha
              password: "{{ snmpv3_auth_password }}"
              priv:
                privacy_password: "{{ snmpv3_priv_password }}"
                aes_128: true
    state: merged
  no_log: true
  when:
    - snmpv3_auth_password | default('') | length > 0
    - snmpv3_priv_password | default('') | length > 0
    - snmpv3_auth_password != 'CHANGE_ME'
    - snmpv3_priv_password != 'CHANGE_ME'

# V-220498 (redundant time sources) + V-220502 (authentication). V-220502 is a
# permanent finding regardless - NX-OS only supports MD5 here, which is not
# FIPS compliant, and DISA's own Check Text says so. Configured anyway as the
# best available mitigation, so the audit's FAIL reflects the platform limit
# rather than an unconfigured service.
#
# Gated on the key being present. A server entry written without one replaces
# the keyed entry on the device and silently drops authentication, so the safe
# failure is to skip: fill and encrypt vault.yml to configure NTP from here.
- name: "V-220498/V-220502 - NTP servers with MD5 authentication"
  cisco.nxos.nxos_ntp_global:
    config:
      authenticate: true
      authentication_keys:
        - id: "{{ ntp_auth_key_id }}"
          key: "{{ ntp_auth_key_value }}"
      trusted_keys:
        - key_id: "{{ ntp_auth_key_id }}"
      # 'use_vrf: default' matches how NX-OS renders the line; omitting it is
      # what made the raw-lines version of this task re-push every run.
      servers: >-
        [{% for s in ntp_servers %}
          {'server': '{{ s }}', 'key_id': {{ ntp_auth_key_id }}, 'use_vrf': 'default'}{{ ',' if not loop.last else '' }}
        {% endfor %}]
    state: merged
  no_log: true
  when:
    - ntp_servers | default([]) | length > 0
    - ntp_auth_key_value | default('') | length > 0
    - ntp_auth_key_value != 'CHANGE_ME'
