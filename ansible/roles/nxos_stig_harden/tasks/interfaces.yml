---
# Mirrors nxos_stig_harden_interfaces.py's access-port and trunk-port passes.
# An interface counts as trunk only if its block contains 'switchport mode
# trunk'; everything else switchport-capable is treated as access, the same
# rule the Python uses.
#
# NOT ported here, on purpose - both need live state this role does not
# gather, and getting either wrong causes a real outage rather than a failed
# audit:
#   - V-220680 (Root Guard) needs live STP root-port detection
#     (stig_common.discover_root_port_interfaces) so this switch's own root
#     port is excluded. Pushing Root Guard onto the root port puts it in
#     root-inconsistent/blocking state and severs the uplink. The Python
#     script excludes port-channel20 on NXCore1 for exactly this reason.
# Run nxos_stig_harden_interfaces.py for Root Guard.
#
# V-220690 (disabled ports -> unused VLAN) WAS in that list and is now
# implemented below. It does need per-port admin state from
# 'show interface status' - running-config genuinely cannot supply it, because
# `shutdown` is an NX-OS default and is therefore never rendered.

- name: Gather show running-config for interface classification
  cisco.nxos.nxos_command:
    commands:
      - show running-config
  register: nxos_running_config

- name: All switchport-capable interface names
  set_fact:
    all_switchports: >-
      {{
        nxos_running_config.stdout[0]
        | regex_findall('(?m)^interface ((?:Ethernet|port-channel)\S*)')
      }}

# Same single-capture-group shape the L2S role uses - the negative lookahead
# keeps the match inside one interface block, so this returns a flat list of
# names rather than tuples needing further filtering.
- name: Trunk-classified interface names (block contains 'switchport mode trunk')
  set_fact:
    trunk_ports: >-
      {{
        nxos_running_config.stdout[0]
        | regex_findall('(?ms)^interface ((?:Ethernet|port-channel)\S*)\n(?:(?!^interface \S).)*switchport mode trunk')
      }}

- name: Access-classified interface names (everything switchport-capable that is not a trunk)
  set_fact:
    access_ports: "{{ all_switchports | difference(trunk_ports) }}"

# Port-channel members inherit their switchport configuration from the
# port-channel interface, and NX-OS rejects re-issuing 'switchport mode
# trunk'/'switchport trunk ...' directly on a member once it is bundled.
# nxos_stig_harden_interfaces.py hit this live on NXCore1's Ethernet1/1,
# 1/2 and 1/9 and now skips members the same way. Detected by the member's
# own 'channel-group <n>' line.
- name: Port-channel member interfaces (carry a 'channel-group <n>' line)
  set_fact:
    channel_members: >-
      {{
        nxos_running_config.stdout[0]
        | regex_findall('(?ms)^interface ((?:Ethernet|port-channel)\S*)\n(?:(?!^interface \S).)*channel-group \d+')
      }}

- name: Trunk ports eligible for switchport configuration (port-channels themselves, not their members)
  set_fact:
    trunk_config_targets: "{{ trunk_ports | difference(channel_members) }}"

# V-220690: administratively-shutdown ports are pulled OUT of the trunk-
# conversion population and parked on the unused VLAN instead. Trunking a port
# nobody is using defeats the point of designating it unused - it would carry
# every allowed VLAN on a dead link.
#
# 'disabled' specifically is what NX-OS calls an administratively shutdown port
# in `show interface status`. Deliberately NOT 'suspended' (a port-channel
# member with no active peer) or 'notconnect' (up, but no link partner) -
# neither of those means unused. Same three-way distinction
# nxos_stig_harden_interfaces.py's parse_interface_status() draws, confirmed
# live on NXCore1.
#
# This needs its own round trip: running-config alone cannot tell an
# administratively disabled port from one shut for any other reason, which is
# why the Python reads `show interface status` too rather than parsing config
# text. It is the reason this rule stayed unported when the rest of the
# interface pass was written.
#
# Gated on unused_vlan: with nowhere to park them, disabled ports are simply
# left as trunk targets, exactly as before this existed.
- name: Gather show interface status (for V-220690 disabled-port detection)
  cisco.nxos.nxos_command:
    commands:
      - show interface status
  register: nxos_interface_status
  changed_when: false
  when: unused_vlan | string | length > 0

# `show interface status` prints short names (Eth1/5, Po20); running-config and
# every other fact here uses the long form, so they have to be reconciled before
# any set operation between them means anything.
#
# Expanded with two anchored substitutions rather than a '^(.*)$' -> '\1'
# backreference: Jinja processes escapes inside its own string literals, so a
# backslash-digit backreference reaches regex_replace as a control character.
# That bug was found and fixed in nxos_stig_harden_aaa; this avoids it by
# construction. The (?=\d) lookahead is what stops an already-long 'Ethernet1/1'
# becoming 'Etherneternet1/1'.
#
# Note `\sdisabled\s` and NOT `\bdisabled\b`, for the same escaping reason: \b
# is a REAL Python escape (backspace, 0x08), so a word-boundary written inside a
# Jinja literal silently becomes a control character and the pattern matches
# nothing at all. Caught by rendering this against sample output before running
# it - it would otherwise have looked like "no disabled ports found" forever.
# Requiring whitespace before it also excludes 'err-disabled', which is a
# different NX-OS status and does not mean administratively shut.
- name: Administratively-disabled interface names (V-220690)
  set_fact:
    disabled_ports: >-
      {{
        nxos_interface_status.stdout[0]
        | regex_findall('(?m)^(\S+)\s+.*?\sdisabled\s')
        | map('regex_replace', '^Eth(?=\d)', 'Ethernet')
        | map('regex_replace', '^Po(?=\d)', 'port-channel')
        | list
      }}
  when: unused_vlan | string | length > 0

# The Name column in `show interface status` is free text, so an interface whose
# DESCRIPTION contains the word "disabled" matches the pattern above and is a
# false positive - and a false positive here parks a live port on the black-hole
# VLAN, an outage rather than a failed audit. That needs guarding against.
#
# A running-config cross-check was tried first and does NOT work on NX-OS:
# `shutdown` is the DEFAULT state of a physical port, so plain running-config
# omits it entirely and renders only the non-default `no shutdown`. Confirmed
# live on NXCore1 2026-08-12 - Ethernet1/5 is administratively down and its
# config block reads only `switchport` / `switchport access vlan 1000`. A
# shutdown-line cross-check therefore matched zero ports on a switch with 59
# disabled ones, silently reducing V-220690 to a permanent no-op. Same
# default-value trap as `radius-server retransmit 1` in the AAA role.
#
# This instead uses the one source that does carry the truth. A row misread via
# its description still contains its REAL status elsewhere on the line, so any
# port matching a non-disabled status too is ambiguous and dropped. That fails
# safe in the direction that matters: an ambiguous port is left alone rather
# than blackholed.
- name: Interfaces whose status row also matches a non-disabled state (ambiguous)
  set_fact:
    ambiguous_ports: >-
      {{
        nxos_interface_status.stdout[0]
        | regex_findall('(?m)^(\S+)\s+.*?\s(?:connected|suspended|notconnect|noOperMem|inactive|xcvrAbsent|sfpAbsent|err-disabled)\s')
        | map('regex_replace', '^Eth(?=\d)', 'Ethernet')
        | map('regex_replace', '^Po(?=\d)', 'port-channel')
        | list
      }}
  when: unused_vlan | string | length > 0

# Scoped to trunk_config_targets, matching the Python, which only reclassifies
# ports it was otherwise about to trunk. A disabled port already classified as
# access is left alone - it has an explicit access VLAN someone chose, and
# V-220690 is about not trunking unused ports, not about relocating configured
# ones.
#
# Disabled, minus anything ambiguous, intersected with what was about to be
# trunked.
- name: Disabled ports that would otherwise have been trunk-converted
  set_fact:
    disabled_trunk_targets: >-
      {{
        trunk_config_targets
        | intersect(disabled_ports | default([]))
        | difference(ambiguous_ports | default([]))
      }}

- name: Remove disabled ports from the trunk-conversion population
  set_fact:
    trunk_config_targets: "{{ trunk_config_targets | difference(disabled_trunk_targets) }}"

- name: "V-220690 - park administratively-disabled ports on the unused VLAN"
  cisco.nxos.nxos_config:
    parents: "interface {{ item }}"
    lines:
      - switchport
      - switchport mode access
      - "switchport access vlan {{ unused_vlan }}"
  loop: "{{ disabled_trunk_targets }}"
  when: disabled_trunk_targets | length > 0

# V-220683/687/685 - per access port. IP Source Guard uses NX-OS's own
# 'ip verify source dhcp-snooping-vlan' form, confirmed different from IOS's
# bare 'ip verify source'. Storm control level 40 matches the Python.
#
# IPSG only trusts the DHCP snooping binding table, so a statically-addressed
# host with no DHCP lease has its traffic dropped once this is applied - the
# same unresolved gap the L2S ipsg/dai roles are split out for. It is included
# here rather than split because NXCore1's only access ports are server-facing
# and DHCP-addressed; revisit if that changes.
- name: "V-220683/687/685 - UUFB, storm control and IP Source Guard on access ports"
  cisco.nxos.nxos_config:
    lines:
      - switchport block unicast                  # V-220683 (UUFB)
      # 40.00, not 40 - NX-OS renders the level to two decimal places in
      # running-config, and nxos_config compares literally, so sending "40"
      # never matches and re-pushes on every run. The Python side sends "40"
      # via Netmiko, which does not care because it never diffs.
      - storm-control broadcast level 40.00       # V-220687 (storm control)
      - ip verify source dhcp-snooping-vlan       # V-220685 (IP Source Guard)
    parents: "interface {{ item }}"
  loop: "{{ access_ports }}"
  when: access_ports | length > 0

# V-220692/695 - per trunk port, via nxos_l2_interfaces rather than raw config
# lines. The module compares the parsed switchport state as data, so an
# allowed-VLAN list the device reorders or re-ranges (10,50,100 vs 10,50,100
# vs 10,50,100-100) still matches - string comparison would not.
#
# The allowed-VLAN list keeps management and server VLANs (they must cross
# trunks) but drops VLAN 1, unused_vlan and native_vlan, which is what
# satisfies V-220692's default-VLAN pruning.
#
# state: merged, not overridden - overridden would strip switchport settings
# on any interface not listed here, including the access ports configured
# above and the port-channel members deliberately left alone.
- name: "V-220692/695 - trunk allowed-VLAN scoping and native VLAN"
  cisco.nxos.nxos_l2_interfaces:
    config: >-
      [{% for i in trunk_config_targets %}
        {'name': '{{ i }}', 'mode': 'trunk',
         'trunk': {'native_vlan': {{ native_vlan }},
                   'allowed_vlans': '{{ allowed_trunk_vlan_ids | join(",") }}'}}{{ ',' if not loop.last else '' }}
      {% endfor %}]
    state: merged
  when:
    - trunk_config_targets | length > 0
    - allowed_trunk_vlan_ids | length > 0
    - native_vlan | string | length > 0
